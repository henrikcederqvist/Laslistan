name: Python CI/CD

# Talar om när jobben ska köras. Denna inställning bevakar när man gör push eller pull request mot branchen "main".
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend – unittest
    runs-on: ubuntu-latest
    steps:
      # 1. Hämta koden
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installera Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 3. Installera beroenden
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # 4. Linting
      - name: Lint code with flake8
        run: flake8 backend features pages

      # 5. Kör backend-tester
      - name: Run backend-tests
        run: |
          python3 -m unittest discover -s backend/tests -v

  frontend-tests:
    name: Frontend – Behave + Playwright (headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installera Python-beroenden
        run: pip install behave playwright

      - name: Installera Playwright-browsers
        run: playwright install --with-deps chromium

      - name: Kör frontend-tester (headless)
        env:
          HEADLESS: "true"
        run: behave
