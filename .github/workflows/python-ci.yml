name: Python CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend – unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint code with flake8
        run: flake8 backend features pages

      - name: Run backend-tests
        run: |
          python3 -m unittest discover -s backend/tests -v

  frontend-tests:
    name: Frontend – Behave + Playwright (headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installera Python-beroenden
        run: pip install git+https://github.com/behave/behave.git playwright

      - name: Visa behave-version
        run: behave --version

      - name: Installera Playwright-browsers
        run: playwright install --with-deps chromium

      - name: Testa playwright import
        run: python3 -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); print('OK'); b.close(); p.stop()"

      - name: Verifiera environment.py hittas
        run: python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('environment','environment.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print('hooks:', [x for x in dir(m) if 'before' in x or 'after' in x])"

      - name: Kör frontend-tester (headless)
        env:
          HEADLESS: "true"
        run: behave --no-capture